version: "3.9"

services:
  phpyserver:
    build: .
    ports:
      - "${PORT:-5000}:5000"
    volumes:
      - ./code:/app/code          # live-edit your PHP/HTML/CSS files
      - ./logs:/app/logs
    environment:
      - HOST=0.0.0.0
      - PORT=5000
      - DEBUG=${DEBUG:-false}
      - PHP_BINARY=php
      - PHP_TIMEOUT=30
      - MAX_UPLOAD_MB=10
      - CACHE_TTL=60
      - SECRET_KEY=${SECRET_KEY:-change-me}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
